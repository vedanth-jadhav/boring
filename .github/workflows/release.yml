name: Build macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The app requires the macOS 27 SDK. GitHub's xcode-27 runner image
    # includes the matching Xcode/Command Line Tools and Apple Swift toolchain.
    runs-on: xcode-27
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build and package ad-hoc signed DMG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (got $GITHUB_REF_NAME)" >&2
            exit 2
          fi
          bash Scripts/package_release.sh "$version"

      - name: Publish GitHub Release with DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already published; preserving its existing DMG and checksum."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/releases/Boring-Notch-Octave-${GITHUB_REF_NAME#v}-macOS.dmg" \
            "build/releases/Boring-Notch-Octave-${GITHUB_REF_NAME#v}-macOS.dmg.sha256" \
            --title "Boring Notch Octave ${GITHUB_REF_NAME#v}" \
            --generate-notes
