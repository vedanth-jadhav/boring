name: Publish DMG release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create release for latest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 && gh release delete latest --yes || true
          gh release create latest 'dist/Boring Notch Octave.dmg' \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Latest Boring Notch Octave build' \
            --notes 'Latest private build from main. Download the DMG and drag the app to Applications.' \
            --latest
