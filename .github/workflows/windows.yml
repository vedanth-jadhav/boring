name: Windows desktop
on:
  push:
    paths: ['windows/**', 'octave-brave-extension/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'octave-brave-extension/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/electron/package-lock.json
      - name: Test core and file operations
        run: dotnet test Boring.Tests/Boring.Tests.csproj -c Release
      - name: Test browser bridge
        run: node Scripts/test_octave_lyrics.cjs
        working-directory: .
      - name: Test Electron timing and IPC
        run: |
          npm ci
          npm test
        working-directory: windows/electron
      - name: Build self-contained Windows distribution
        run: ./Scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Boring-Notch-Octave-Windows-x64
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
      - name: Publish Windows download
        if: github.ref == 'refs/heads/codex/windows-port'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create windows-v1.0.0 `
            artifacts/Boring-Notch-Octave-Windows-x64.zip `
            artifacts/Boring-Notch-Octave-Windows-x64.zip.sha256 `
            --target $env:GITHUB_SHA `
            --title "Boring Notch Octave for Windows 1.0.0" `
            --notes-file RELEASE-NOTES.md
